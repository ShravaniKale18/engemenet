<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ringBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9f5"/>
      <stop offset="60%" stop-color="#fcedea"/>
      <stop offset="100%" stop-color="#f5ded5"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f"/>
      <stop offset="25%" stop-color="#fcf6ba"/>
      <stop offset="50%" stop-color="#b38728"/>
      <stop offset="75%" stop-color="#fbf5b7"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#ringBg)" stroke="url(#goldRing)" stroke-width="3"/>
  <!-- Decorative Petals on background -->
  <path d="M120 180 Q100 130 140 120 Q180 130 160 180 Z" fill="#f8bbd0" opacity="0.6"/>
  <path d="M460 220 Q440 170 480 160 Q520 170 500 220 Z" fill="#f8bbd0" opacity="0.6"/>
  <path d="M220 280 Q200 320 240 340 Q280 320 260 280 Z" fill="#ffe082" opacity="0.6"/>
  <!-- Intertwined Rings -->
  <!-- Ring 1 (Groom's Band) -->
  <circle cx="260" cy="200" r="75" fill="none" stroke="url(#goldRing)" stroke-width="18"/>
  <circle cx="260" cy="200" r="66" fill="none" stroke="#6d4c41" stroke-width="1"/>
  <!-- Ring 2 (Bride's Solitaire Diamond Ring) -->
  <circle cx="340" cy="180" r="70" fill="none" stroke="url(#goldRing)" stroke-width="15"/>
  <!-- Diamond Setting -->
  <polygon points="340,90 320,115 360,115" fill="url(#goldRing)"/>
  <polygon points="340,75 320,95 360,95" fill="url(#diamondGrad)" stroke="#b2ebf2" stroke-width="1.5"/>
  <polygon points="340,65 352,75 328,75" fill="#ffffff"/>
  <!-- Sparkles -->
  <path d="M340 45 L345 60 L360 65 L345 70 L340 85 L335 70 L320 65 L335 60 Z" fill="url(#goldRing)"/>
  <path d="M400 120 L403 130 L413 133 L403 136 L400 146 L397 136 L387 133 L397 130 Z" fill="url(#goldRing)"/>
  <path d="M210 130 L212 138 L220 140 L212 142 L210 150 L208 142 L200 140 L208 138 Z" fill="url(#goldRing)"/>
  <text x="300" y="320" text-anchor="middle" font-family="'Cinzel Decorative', serif" font-size="18" fill="#8e6a1d" font-weight="700">THE SACRED RINGS • शुभ साखरपुडा</text>
  <text x="300" y="348" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="15" fill="#6e5e57" font-style="italic">Symbols of Eternal Love &amp; Togetherness</text>
</svg>

